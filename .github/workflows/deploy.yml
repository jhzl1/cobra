name: Deploy

# The only way code reaches Railway and Vercel. Both platforms have their git
# auto-deploys turned off (.railway/railway.ts, apps/web/vercel.json), so every
# deploy happens once, here, after the migrations it depends on.
#
# The GitHub Environment (`dev` or `production`) is the single source of every
# app's variables: the jobs below copy them into Railway and into the Vercel
# build on each run. A value changed in Railway's or Vercel's dashboard is
# overwritten by the next deploy.
on:
  push:
    branches: [develop, main]
  # Redeploys the branch it is run from, with a new version number. Only develop
  # and main are accepted; see the `target` job.
  workflow_dispatch:

# One deploy per environment at a time, never cancelled halfway: a run that is
# migrating or uploading must finish. GitHub keeps one pending run per group, so
# a burst of pushes deploys the latest commit and skips the ones in between.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # `changes` asks GitHub which commit this branch last deployed.
  actions: read

jobs:
  target:
    name: Target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      railway-environment: ${{ steps.pick.outputs.railway-environment }}
    steps:
      # Fails instead of skipping: a dispatch from a feature branch would
      # otherwise end green having deployed nothing.
      - id: pick
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            develop) environment=dev; railway_environment=development ;;
            main) environment=production; railway_environment=production ;;
            *)
              echo "::error::Only develop and main deploy. This run is on $REF_NAME."
              exit 1
              ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "railway-environment=$railway_environment" >> "$GITHUB_OUTPUT"

  # Which apps this run deploys: those affected by what changed since this
  # branch's last successful deploy. Not since the previous push: the
  # concurrency group skips the runs in between, and a commit that only lived in
  # a skipped run would otherwise never reach its app.
  #
  # turbo decides what "affected" means from the packages' own dependencies, so
  # a change to @cobra/contracts deploys all three apps and one to apps/web only
  # the panel. The deploy setup itself is not a package: touching it deploys
  # everything, and so does a manual run, which exists to redeploy after a
  # variable changes.
  changes:
    name: Changes
    needs: target
    runs-on: ubuntu-latest
    outputs:
      railway: ${{ steps.affected.outputs.railway }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the last deployed commit can be any distance back.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Only the workspace root: turbo is a root dev dependency, and the apps are
      # not needed to work out which of them changed.
      - run: pnpm install --frozen-lockfile --filter cobra

      - id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          deploy_all() {
            echo 'railway=["api","worker"]' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
            echo "Every app deploys: $1." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            deploy_all "manual run"
          fi

          base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
            --branch "$REF_NAME" --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty')"

          if [ -z "$base" ]; then
            deploy_all "$REF_NAME has no earlier successful deploy"
          fi

          # A force push can leave the last deployed commit outside this history.
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            deploy_all "the last deployed commit $base is not in this history"
          fi

          if git diff --name-only "$base" HEAD | grep -Eq '^(\.github/workflows/deploy\.yml|\.github/scripts/|\.railway/|package\.json$|pnpm-workspace\.yaml$|turbo\.json$)'; then
            deploy_all "the deploy setup changed since $base"
          fi

          affected="$(pnpm exec turbo ls --filter="...[$base]" --output=json | jq -c '[.packages.items[].name]')"
          railway="$(jq -c '. as $names | ["api", "worker"] | map(select(("@cobra/" + .) as $name | $names | index($name)))' <<< "$affected")"
          web="$(jq -r 'index("@cobra/web") != null' <<< "$affected")"

          echo "railway=$railway" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Changed since $base: $affected. Railway deploys $railway; the panel deploys: $web." >> "$GITHUB_STEP_SUMMARY"

  # A failed migration stops the deploy: new code must never boot against the
  # schema it does not expect yet.
  migrate:
    needs: target
    uses: ./.github/workflows/migrate.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
    secrets: inherit

  version:
    name: Version
    needs: [target, migrate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      # The minute the deploy started, in Bogota time: the business is Colombian,
      # and a deploy at 8 p.m. local time belongs to that day, not the next UTC
      # one. A timestamp needs no state to count from, and two deploys of one
      # environment cannot share a minute because the concurrency group runs them
      # one after the other.
      - id: stamp
        env:
          ENVIRONMENT: ${{ needs.target.outputs.environment }}
        run: |
          version="$(TZ=America/Bogota date +%Y.%m.%d-%H:%M)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### $ENVIRONMENT · $version" >> "$GITHUB_STEP_SUMMARY"

  railway:
    name: Railway · ${{ matrix.service }}
    needs: [target, version, changes]
    if: needs.changes.outputs.railway != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    # `railway up --ci` waits for a final status, and a deployment Railway
    # skips never reaches one. Without a ceiling the job hangs for six hours.
    timeout-minutes: 20
    strategy:
      # Each service finishes its own deploy: cancelling the other one's CLI
      # would not stop its build on Railway, only hide how it ended.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.railway) }}
    # Every name sync-railway-variables.sh may read. Which service gets which is
    # decided there; this block only exposes them.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_TARGET_ENVIRONMENT: ${{ needs.target.outputs.railway-environment }}
      NODE_ENV: production
      APP_VERSION: ${{ needs.version.outputs.version }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_JWKS_URL: ${{ vars.SUPABASE_JWKS_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CREDENTIALS_MASTER_KEY: ${{ secrets.CREDENTIALS_MASTER_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      TURN_CONCURRENCY: ${{ vars.TURN_CONCURRENCY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinned so a CLI release cannot change how production deploys between
      # two runs. Bump it on purpose, after reading its changelog.
      - run: npm install --global @railway/cli@5.71.0

      - name: Check the token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing RAILWAY_TOKEN in the ${{ needs.target.outputs.environment }} GitHub Environment."
            exit 1
          fi

      - name: Variables
        run: bash .github/scripts/sync-railway-variables.sh "${{ matrix.service }}" "$RAILWAY_TARGET_ENVIRONMENT"

      # --ci streams the build and exits with the deploy's outcome: 0 once it is
      # live, 1 when the build fails, the healthcheck never passes or it crashes.
      # The upload is the checked-out tree; Railway builds it with the service's
      # own build command from .railway/railway.ts.
      - name: Deploy
        run: >-
          railway up
          --ci
          --service "${{ matrix.service }}"
          --environment "$RAILWAY_TARGET_ENVIRONMENT"
          --message "$APP_VERSION"

  # Last, after both Railway services: a panel built for the new api must not go
  # live while the old api is still the one answering.
  #
  # `!cancelled()` because a skipped `railway` (nothing to deploy there) would
  # otherwise skip this job too. A failed `railway` still stops it.
  vercel:
    name: Vercel · web
    needs: [target, version, changes, railway]
    if: >-
      !cancelled()
      && needs.changes.outputs.web == 'true'
      && needs.version.result == 'success'
      && (needs.railway.result == 'success' || needs.railway.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Develop has no production domain, so its fixed address is an alias moved
      # onto every new preview. The api's CORS_ORIGINS names it.
      VERCEL_ALIAS: ${{ vars.VERCEL_ALIAS }}
      IS_PRODUCTION: ${{ needs.target.outputs.environment == 'production' }}
      # What ends up inside the bundle, so only public values: apps/web/.env.example.
      # The Supabase pair is the api's own, read once from the same variables.
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      # The panel's own address, for the absolute image URL of its link preview.
      VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
      VITE_APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # No version pinned: pnpm/action-setup reads `packageManager` from the root
      # package.json. `vercel build` runs the project's install with it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: npm install --global vercel@65.2.0

      - name: Check the environment
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_API_URL VITE_PUBLIC_URL; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "$IS_PRODUCTION" != 'true' ] && [ -z "$VERCEL_ALIAS" ]; then
            missing+=(VERCEL_ALIAS)
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing in the ${{ needs.target.outputs.environment }} GitHub Environment: ${missing[*]}"
            exit 1
          fi

      # Run from the repository root: the Vercel project's Root Directory is
      # apps/web, and the CLI resolves it from here.
      - name: Pull project settings
        run: |
          target=preview
          [ "$IS_PRODUCTION" = 'true' ] && target=production
          vercel pull --yes --environment="$target" --token="$VERCEL_TOKEN"

      # The VITE_* values come from this job's env, not from Vercel: the project
      # keeps no variables of its own, so GitHub stays the only source.
      - name: Build
        run: |
          if [ "$IS_PRODUCTION" = 'true' ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      # stdout is the deployment URL; everything else goes to stderr.
      - name: Deploy
        run: |
          if [ "$IS_PRODUCTION" = 'true' ]; then
            url="$(vercel deploy --prebuilt --prod --meta "version=$VITE_APP_VERSION" --token="$VERCEL_TOKEN")"
          else
            url="$(vercel deploy --prebuilt --meta "version=$VITE_APP_VERSION" --token="$VERCEL_TOKEN")"
            # The REST API and not `vercel alias set`: the CLI loads the token's
            # user before anything else, and this token cannot read one, so it
            # fails with "User not found" even with --scope. The API only needs
            # the team, which deploy already proved the token can act on.
            api='https://api.vercel.com'
            auth="Authorization: Bearer $VERCEL_TOKEN"
            deployment="$(curl -fsS "$api/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" -H "$auth")"
            deployment_id="$(printf '%s' "$deployment" | jq -r .id)"
            alias_body="$(jq -nc --arg alias "$VERCEL_ALIAS" '{alias: $alias}')"
            curl -fsS -X POST "$api/v2/deployments/$deployment_id/aliases?teamId=$VERCEL_ORG_ID" \
              -H "$auth" -H 'Content-Type: application/json' -d "$alias_body" >/dev/null
            echo "Alias $VERCEL_ALIAS now points to $url"
          fi
          echo "Deployed $url"
          echo "web: $url" >> "$GITHUB_STEP_SUMMARY"
