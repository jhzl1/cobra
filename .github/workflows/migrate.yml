name: Migrate

# The shared job. migrate-dev.yml is a thin caller that only picks which GitHub
# Environment supplies the project and its credentials, so production becomes a
# second caller on main instead of a copy of this file.
#
# It applies what the remote `supabase_migrations.schema_migrations` does not
# already record. A migration that is already there is skipped whatever its file
# says now, which is why an applied migration is fixed forward and never edited.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment holding SUPABASE_PROJECT_ID and the credentials.
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: packages/db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # No version pinned here: pnpm/action-setup reads `packageManager` from the
      # root package.json, so a bump there moves CI and every laptop together.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The CLI comes from the lockfile so the version that pushes migrations is
      # the one used to write them. Only this package: the apps are not needed to
      # migrate and installing them costs most of the job.
      - run: pnpm install --frozen-lockfile --filter @cobra/db

      # Checked by hand because an Environment that never defined a value hands
      # the step an empty string, and the CLI then fails asking for a login or a
      # password, which blames the wrong thing.
      - name: Check the environment
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing in the ${{ inputs.environment }} GitHub Environment: ${missing[*]}"
            exit 1
          fi

      - run: pnpm db:link

      - name: Pending migrations
        run: pnpm db:status

      - run: pnpm db:deploy --yes
