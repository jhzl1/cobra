name: Migrate dev

on:
  push:
    branches: [develop]
    # The workflow files are listed so the merge that changes how migrations
    # run also runs them once, instead of waiting for the next migration.
    paths:
      - 'packages/db/supabase/migrations/**'
      - '.github/workflows/migrate.yml'
      - '.github/workflows/migrate-dev.yml'
  # How someone recovers a run that failed halfway, or a database that was
  # migrated by hand and fell behind.
  workflow_dispatch:

# Not cancel-in-progress: a run that is halfway through a migration must finish.
concurrency:
  group: migrate-dev

permissions:
  contents: read

jobs:
  migrate:
    uses: ./.github/workflows/migrate.yml
    with:
      environment: dev
    secrets: inherit
